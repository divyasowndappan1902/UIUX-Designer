<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Virtuo is a modern personal portfolio template for designers, developers, content writer, cleaner, programmer, fashion designer, model, Influencer and freelancers. Fully responsive, SEO-friendly, Bootstrap and easy to customize.">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.svg">
    <title>Sign Up | Virtuo - Personal Portfolio</title>
    <!-- Bootstrap min css -->
    <link rel="stylesheet" href="css/style.css">
    
    
    
    
    <!-- custom css -->
    
</head>

<body style="background-image: linear-gradient(rgba(17, 15, 14, 0.8), rgba(17, 15, 14, 0.95)), url('assets/images/breadcrumb/bg-1.jpg'); background-size: cover; background-position: center; background-attachment: fixed; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 50px 0;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-12 text-center mb--40">
                <a href="index.html">
                    <img src="assets/images/logo/white-logo-reeni.png" alt="Logo" style="max-height: 50px;">
                </a>
            </div>
            <div class="col-lg-5">
                <div class="contact-inner tmp-scroll-trigger tmp-fade-in animation-order-1" style="background: rgba(255,255,255,0.02); padding: 50px 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
                        <div class="section-head text-center mb--40">
                            <span class="subtitle theme-gradient" style="margin-bottom: 10px; display: inline-block;">Sign Up</span>
                            <h3 class="title" style="font-size: 32px; font-weight: 700;">Join Us Today</h3>
                        </div>
                        <div class="contact-form">
                            <form class="tmp-dynamic-form" id="signup-form" action="#">
                                <div class="contact-form-wrapper row">
                                                                        <div class="col-lg-12">
                                        <div class="role-selection-wrapper">
                                            <label class="role-selection-card">
                                                <input type="radio" name="role" value="user" checked>
                                                <div class="role-card-inner">
                                                    <i class="fas fa-user"></i>
                                                    <span>User</span>
                                                </div>
                                            </label>
                                            <label class="role-selection-card">
                                                <input type="radio" name="role" value="admin">
                                                <div class="role-card-inner">
                                                    <i class="fas fa-user-shield"></i>
                                                    <span>Admin</span>
                                                </div>
                                            </label>
                                        </div>
                                    </div>
                                                                        <div class="col-lg-12 mb--25">
                                        <div class="form-group">
                                            <input class="input-field" id="signup-name" name="name" placeholder="Full Name" type="text" required style="width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.15); padding: 18px 25px; border-radius: 8px; color: #fff; font-size: 16px;">
                                        </div>
                                    </div>
                                    <div class="col-lg-12 mb--25">
                                        <div class="form-group">
                                            <input class="input-field" id="login-email" name="email" placeholder="Email Address" type="email" required style="width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.15); padding: 18px 25px; border-radius: 8px; color: #fff; font-size: 16px;">
                                        </div>
                                    </div>
                                    <div class="col-lg-12 mb--25">
                                        <div class="form-group">
                                            <input class="input-field" id="login-password" name="password" placeholder="Password" type="password" required style="width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.15); padding: 18px 25px; border-radius: 8px; color: #fff; font-size: 16px;">
                                        </div>
                                    </div>
                                                                        <div class="col-lg-12 mb--25">
                                        <div class="form-group">
                                            <input class="input-field" id="signup-password-confirm" name="password_confirm" placeholder="Confirm Password" type="password" required style="width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.15); padding: 18px 25px; border-radius: 8px; color: #fff; font-size: 16px;">
                                        </div>
                                    </div>
                                    <div class="col-lg-12 mb--40"></div>
                                        <a href="#" class="forgot-password" style="color: var(--color-primary); font-size: 15px; font-weight: 500; transition: 0.3s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">Forgot Password?</a>
                                    </div>
                                    <div class="col-lg-12 text-center">
                                        <div class="tmp-button-here">
                                            <button class="tmp-btn hover-icon-reverse radius-round" type="submit" style="width: 100%; padding: 18px; display: flex; justify-content: center; background: var(--color-primary); border: none; color: white;">
                                                <span class="icon-reverse-wrapper" style="width: 100%; justify-content: center;">
                                                    <span class="btn-text" style="font-size: 18px; font-weight: 600;">Create Account</span>
                                                </span>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 text-center mt--30">
                                        <p style="color: rgba(255,255,255,0.6); font-size: 16px; margin-bottom: 0;">Already have an account? <a href="login.html" style="color: #fff; font-weight: 600; text-decoration: underline; margin-left: 5px;">Login</a></p>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="assets/js/vendor/jquery.js"></script>
    <script src="assets/js/vendor/jquery-ui.min.js"></script>
    <script src="assets/js/vendor/bootstrap.min.js"></script>
    <script src="assets/js/vendor/swiper.js"></script>
    <script src="assets/js/vendor/counterup.js"></script>
    <script src="assets/js/vendor/waypoints.js"></script>
    <script src="assets/js/vendor/sal.min.js"></script>
    <script src="assets/js/vendor/gsap.min.js"></script>
    <script src="assets/js/vendor/ScrollTrigger.min.js"></script>
    <script src="assets/js/vendor/matter.js"></script>
    <script src="assets/js/vendor/throwable.js"></script>
    <script src="assets/js/main.js"></script>    <script>
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.querySelector('input[name="role"]:checked').value;
            if (role === 'admin') {
                window.location.href = 'admin-dashboard.html';
            } else {
                window.location.href = 'user-dashboard.html';
            }
        });
    </script>
</body>
