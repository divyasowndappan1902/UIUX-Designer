<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stackly is a modern personal portfolio template for designers, developers, content writer, cleaner, programmer, fashion designer, model, Influencer and freelancers. Fully responsive, SEO-friendly, Bootstrap and easy to customize.">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.svg">
    <title>Login | Stackly - Personal Portfolio</title>
    <!-- Bootstrap min css -->
    <link rel="stylesheet" href="css/style.css">
    
    

    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body style=" min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 50px 0; overflow-x: hidden;" class="tmp-white-version">
    <!-- Stackly Preloader -->

    <div class="bg-animation" style="position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: -1; overflow: hidden; background: #24202a;">
        <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 100 100" style="width: 100%; height: 100%; filter: blur(30px); opacity: 0.6;">
            <circle cx="20" cy="20" r="25" fill="#8b5cf6">
                <animate attributeName="cy" values="20; 80; 20" dur="12s" repeatCount="indefinite" />
                <animate attributeName="cx" values="20; 50; 20" dur="18s" repeatCount="indefinite" />
            </circle>
            <circle cx="80" cy="70" r="30" fill="#d946ef">
                <animate attributeName="cy" values="70; 10; 70" dur="15s" repeatCount="indefinite" />
                <animate attributeName="cx" values="80; 40; 80" dur="22s" repeatCount="indefinite" />
            </circle>
            <circle cx="50" cy="50" r="25" fill="#6366f1">
                <animate attributeName="cy" values="50; 90; 50" dur="19s" repeatCount="indefinite" />
                <animate attributeName="cx" values="50; 10; 50" dur="25s" repeatCount="indefinite" />
            </circle>
        </svg>
    </div>
        <a href="index.html" class="back-btn-mobile" style="position: absolute; top: 30px; left: 30px; color: #a19fad; text-decoration: none; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; transition: 0.3s; z-index: 10;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#a19fad'">
        <span class="material-icons">arrow_back</span>
        Back to Home
    </a>
    <div class="container" style="position: relative;">
        <div class="row justify-content-center">
            <div class="col-lg-12 text-center mb--15 logo-mobile-margin">
                <a href="index.html">
                    <img src="assets/images/logo_0006.webp" alt="Logo" style="max-height: 30px; object-fit: contain;">
                </a>
            </div>
            <div class="col-lg-5">
                <div class="contact-inner   " style="background: #2d2932; padding: 35px 20px; border-radius: 20px; border: 1px solid #423d4a; box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
                        <div class="section-head text-center mb--15">
                            <span class="subtitle" style="margin-bottom: 10px; display: inline-block; color: #a19fad;">Login</span>
                            <h3 class="title" style="font-size: 32px; font-weight: 700; color: #ffffff;">Welcome Back</h3>
                            <p style="color: #a19fad; font-size: 15px;">Sign in to your account to continue</p>
                        </div>
                        <div class="contact-form">
                            <form class="tmp-dynamic-form" id="login-form" action="#">
                                <div class="contact-form-wrapper row">
                                    <div class="col-lg-12">
                                        <div class="role-selection-wrapper" style="display: flex; gap: 15px; margin-bottom: 15px;">
                                            <label class="role-selection-card" style="flex: 1; cursor: pointer;">
                                                <input type="radio" name="role" value="user" checked style="display: none;">
                                                <div class="role-card-inner" style="border: 1px solid #423d4a; border-radius: 10px; padding: 10px; text-align: center; color: #a19fad; transition: 0.3s;">
                                                    <span class="material-icons" style="display: block; font-size: 20px; margin-bottom: 8px;">person</span>
                                                    <span>User</span>
                                                </div>
                                            </label>
                                            <label class="role-selection-card" style="flex: 1; cursor: pointer;">
                                                <input type="radio" name="role" value="admin" style="display: none;">
                                                <div class="role-card-inner" style="border: 1px solid #423d4a; border-radius: 10px; padding: 10px; text-align: center; color: #a19fad; transition: 0.3s;">
                                                    <span class="material-icons" style="display: block; font-size: 20px; margin-bottom: 8px;">verified_user</span>
                                                    <span>Admin</span>
                                                </div>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 mb--15">
                                        <div class="form-group">
                                            <input class="input-field" id="login-email" name="email" placeholder="hello@example.com" type="email" required style="width: 100%; background: #24202a; border: 1px solid #423d4a; padding: 12px 18px; border-radius: 10px; color: #fff; font-size: 16px; font-family: inherit;">
                                        </div>
                                    </div>
                                    <div class="col-lg-12 mb--15">
                                        <div class="form-group">
                                            <input class="input-field" id="login-password" name="password" placeholder="********" type="password" required minlength="8" style="width: 100%; background: #24202a; border: 1px solid #423d4a; padding: 12px 18px; border-radius: 10px; color: #fff; font-size: 16px; font-family: inherit;">
                                        </div>
                                    </div>
                                    <div class="col-lg-12 mb--15 d-flex justify-content-between align-items-center flex-wrap" style="gap: 10px;">
                                        <div class="form-check" style="display: flex; align-items: center; gap: 8px;">
                                            <input class="form-check-input" type="checkbox" id="rememberMe" style="background: transparent; border: 1px solid rgba(255,255,255,0.3); margin-top: 0; cursor: pointer; accent-color: var(--color-primary);">
                                            <label class="form-check-label" for="rememberMe" style="color: #a19fad; font-size: 15px; cursor: pointer;">
                                                Remember Me
                                            </label>
                                        </div>
                                        <a href="404.html" class="forgot-password" style="color: #ffffff; font-size: 15px; font-weight: 500; transition: 0.3s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">Forgot Password?</a>
                                    </div>
                                    <div class="col-lg-12 text-center">
                                        <div class="tmp-button-here">
                                            <button class="tmp-btn hover-icon-reverse radius-round" type="submit" style="width: 100%; padding: 12px; display: flex; justify-content: center; background: #ffffff; border: none; color: #000000; border-radius: 10px;">
                                                <span class="icon-reverse-wrapper" style="width: 100%; justify-content: center;">
                                                    <span class="btn-text" style="font-size: 18px; font-weight: 700;">Sign In</span>
                                                </span>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 text-center mt--20">
                                        <div style="display: flex; align-items: center; margin-bottom: 15px;">
                                            <div style="flex-grow: 1; height: 1px; background: #423d4a;"></div>
                                            <span style="color: #a19fad; font-size: 14px; padding: 0 15px;">Or continue with</span>
                                            <div style="flex-grow: 1; height: 1px; background: #423d4a;"></div>
                                        </div>
                                        <div class="social-login-icons" style="display: flex; justify-content: center; gap: 15px; margin-bottom: 0px;">
                                            <a href="404.html" style="display: inline-flex; align-items: center; justify-content: center; width: 35px; height: 35px; border-radius: 50%; background: #24202a; border: 1px solid #423d4a; color: #ffffff; text-decoration: none; transition: 0.3s;" onmouseover="this.style.background='#423d4a'" onmouseout="this.style.background='#24202a'"><span class="material-icons" style="color:#ea4335;">language</span></a>
                                            <a href="404.html" style="display: inline-flex; align-items: center; justify-content: center; width: 35px; height: 35px; border-radius: 50%; background: #24202a; border: 1px solid #423d4a; color: #ffffff; text-decoration: none; transition: 0.3s;" onmouseover="this.style.background='#423d4a'" onmouseout="this.style.background='#24202a'"><span class="material-icons" style="color:#1877f2;">facebook</span></a>
                                            <a href="404.html" style="display: inline-flex; align-items: center; justify-content: center; width: 35px; height: 35px; border-radius: 50%; background: #24202a; border: 1px solid #423d4a; color: #ffffff; text-decoration: none; transition: 0.3s;" onmouseover="this.style.background='#423d4a'" onmouseout="this.style.background='#24202a'"><span class="material-icons">smartphone</span></a>
                                        </div>
                                    </div>
                                    <div class="col-lg-12 text-center mt--20">
                                        <p style="color: #a19fad; font-size: 16px; margin-bottom: 0;">Don't have an account? <a href="signup.html" style="color: #ffffff; font-weight: 700; margin-left: 5px;">Create one</a></p>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
            </div>
        </div>
    </div>
    <style>
        * {
            box-sizing: border-box;
        }
        @media (max-width: 576px) {
            .logo-mobile-margin {
                margin-top: 30px;
            }
        }
        input[type="radio"]:checked + .role-card-inner {
            border-color: #ffffff !important;
            color: #ffffff !important;
            background: rgba(255,255,255,0.05) !important;
        }
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active { 
            -webkit-box-shadow: 0 0 0 30px #24202a inset !important; 
            -webkit-text-fill-color: #ffffff !important; 
            font-family: inherit !important; 
        }
    </style>
    
    <!-- Scripts -->
    <script src="js/script.js"></script>
    <script>
        

                document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailValue = document.getElementById('login-email').value;
            if(emailValue) {
                localStorage.setItem('Stackly_login_email', emailValue);
            }
            const role = document.querySelector('input[name="role"]:checked').value;
            if (role === 'admin') {
                window.location.href = 'admin-dashboard.html';
            } else {
                window.location.href = 'user-dashboard.html';
            }
        });
    </script>
</body>
</html>
