<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stackly is a modern personal portfolio template for designers, developers, content writer, cleaner, programmer, fashion designer, model, Influencer and freelancers. Fully responsive, SEO-friendly, Bootstrap and easy to customize.">
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.svg">
    <title>Stackly Personal Portfolio HTML Template</title>
    <!-- Bootstrap min css -->
    <link rel="stylesheet" href="css/style.css">
    
    
    
    
    
    <!-- custom css -->
    

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body class="tmp-white-version">
    <!-- Stackly Preloader -->


    <!-- tmp banner area start -->

    <div style="text-align: center; padding: 100px 20px;">
        <div class="error-animation" style="display: flex; justify-content: center; margin-bottom: 10px;">
            <svg width="250" height="250" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
                <style>
                    @keyframes float {
                        0%, 100% { transform: translateY(0); }
                        50% { transform: translateY(-20px); }
                    }
                    @keyframes shadow {
                        0%, 100% { transform: scale(1); opacity: 0.3; }
                        50% { transform: scale(0.8); opacity: 0.1; }
                    }
                    @keyframes blink {
                        0%, 100% { transform: scaleY(1); }
                        5% { transform: scaleY(0.1); }
                        10% { transform: scaleY(1); }
                    }
                    .ghost { animation: float 3.5s ease-in-out infinite; }
                    .shadow { animation: shadow 3.5s ease-in-out infinite; transform-origin: 125px 230px; }
                    .eye { transform-origin: center; animation: blink 4s infinite; }
                </style>
                
                <!-- Shadow -->
                <ellipse cx="125" cy="230" rx="50" ry="8" fill="#ffffff" class="shadow" />
                
                <!-- Ghost -->
                <g class="ghost">
                    <!-- Ghost Body -->
                    <path d="M 75 160 C 75 80, 175 80, 175 160 C 175 180, 160 190, 150 175 C 140 160, 125 185, 125 175 C 125 185, 110 160, 100 175 C 90 190, 75 180, 75 160 Z" fill="#ffffff" stroke="var(--color-primary, #139bfd)" stroke-width="3" />
                    
                    <!-- Eyes -->
                    <ellipse cx="105" cy="115" rx="6" ry="10" fill="#110f0e" class="eye" />
                    <ellipse cx="145" cy="115" rx="6" ry="10" fill="#110f0e" class="eye" />
                    
                    <!-- Mouth -->
                    <path d="M 115 135 Q 125 145 135 135" stroke="#110f0e" stroke-width="4" stroke-linecap="round" fill="none" />
                    
                    <!-- Cheeks -->
                    <circle cx="92" cy="125" r="5" fill="#ff6b6b" opacity="0.6" />
                    <circle cx="158" cy="125" r="5" fill="#ff6b6b" opacity="0.6" />
                </g>
            </svg>
        </div>
        <h1 style="font-size: 64px; margin-bottom: 5px; color: var(--color-primary, #139bfd);">404</h1>
        <h2 style="font-size: 32px; margin-bottom: 15px;">Page Not Found</h2>
        <p style="margin-bottom: 30px; font-size: 16px; opacity: 0.8;">Sorry, the page you are looking for does not exist or has been moved.</p>
        <a href="javascript:history.back()" class="tmp-btn btn-border radius-round" style="margin-right: 15px; border: 1px solid rgba(255,255,255,0.2);">Go to Previous Page</a>
        <a href="index.html" class="tmp-btn btn-primary radius-round">Go Back Home</a>
    </div>



    <script src="js/script.js"></script>
    <!-- bootstrap Js-->
    <!-- custom Js -->
    </body>

</html>
